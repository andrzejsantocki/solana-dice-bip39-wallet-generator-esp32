name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build firmware
        run: python -m platformio run
      - name: Prepare firmware assets
        run: |
          cp .pio/build/cardputer_adv_launcher/firmware.bin DiceWallet-cardputer-adv.bin
          sha256sum DiceWallet-cardputer-adv.bin > DiceWallet-cardputer-adv.bin.sha256
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cardputer-adv-firmware
          path: |
            DiceWallet-cardputer-adv.bin
            DiceWallet-cardputer-adv.bin.sha256
      - name: Publish GitHub release from CI-built firmware
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            DiceWallet-cardputer-adv.bin DiceWallet-cardputer-adv.bin.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "CI-built Cardputer ADV firmware. This release asset was built by GitHub Actions from tag $GITHUB_REF_NAME."
