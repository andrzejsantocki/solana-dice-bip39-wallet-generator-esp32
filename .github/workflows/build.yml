name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Build host test harness (ASan + UBSan)
        run: bash tests/build_host_test.sh
        env:
          SANFLAGS: -fsanitize=address,undefined
      - name: Run crypto + pipeline vector tests
        run: ./tests/host_test/host_test

  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build firmware
        run: python -m platformio run
      - name: Prepare firmware assets
        run: |
          cp .pio/build/cardputer_adv_launcher/firmware.bin DiceWallet-cardputer-adv.bin
          sha256sum DiceWallet-cardputer-adv.bin > DiceWallet-cardputer-adv.bin.sha256
      - name: Upload firmware artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cardputer-adv-firmware
          path: |
            DiceWallet-cardputer-adv.bin
            DiceWallet-cardputer-adv.bin.sha256

  release:
    runs-on: ubuntu-latest
    needs: [host-tests, platformio]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download CI-built firmware
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: cardputer-adv-firmware
      - name: Publish GitHub release from CI-built firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # no checkout step in this job: tell gh the repo explicitly
          BIN=$(find . -name "DiceWallet-cardputer-adv.bin" | head -1)
          SHA=$(find . -name "DiceWallet-cardputer-adv.bin.sha256" | head -1)
          test -n "$BIN" && test -n "$SHA"
          gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            "$BIN" "$SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes "CI-built Cardputer ADV firmware. Built by GitHub Actions from tag $GITHUB_REF_NAME after host crypto/vector tests and firmware build both passed."
